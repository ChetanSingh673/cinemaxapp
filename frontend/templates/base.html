<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CineBook - Your Ultimate Movie Experience{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #E63946;
            --primary-dark: #C1121F;
            --primary-light: #FF6B7A;
            --secondary: #1D3557;
            --accent: #F4A261;
            --accent2: #A8DADC;
            --gold: #FFD700;
            --bg-dark: #0A0A0F;
            --bg-card: #12121A;
            --bg-card2: #1A1A28;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B3C1;
            --text-muted: #6B6F82;
            --border: rgba(255,255,255,0.08);
            --gradient-hero: linear-gradient(135deg, #0A0A0F 0%, #1D1040 50%, #0A0A0F 100%);
            --gradient-card: linear-gradient(145deg, #1A1A28, #12121A);
            --gradient-primary: linear-gradient(135deg, #E63946, #C1121F);
            --gradient-gold: linear-gradient(135deg, #FFD700, #FFA500);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-hover: 0 20px 60px rgba(230,57,70,0.3);
            --radius: 16px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── NAVBAR ─── */
        .navbar {
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .brand-icon {
            width: 40px; height: 40px;
            background: var(--gradient-primary);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }
        .brand-name {
            font-size: 1.5rem; font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-tagline { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
        .navbar-right { display: flex; align-items: center; gap: 1rem; }
        .nav-user {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px;
        }
        .nav-user-avatar {
            width: 30px; height: 30px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700;
        }
        .nav-user-name { font-size: 0.875rem; font-weight: 500; }
        .btn-logout {
            background: transparent;
            border: 1px solid rgba(230,57,70,0.4);
            color: var(--primary-light);
            padding: 6px 14px; border-radius: 50px;
            font-size: 0.8rem; cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-logout:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* ─── MAIN CONTENT ─── */
        .main-content { min-height: calc(100vh - 70px - 80px); }

        /* ─── FOOTER ─── */
        .footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 1.5rem 2rem;
            text-align: center;
        }
        .footer-inner { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .footer-text { color: var(--text-muted); font-size: 0.875rem; }
        .footer-brand { color: var(--primary-light); font-weight: 600; }
        .footer-yt {
            display: flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #FF0000, #CC0000);
            color: white; text-decoration: none;
            padding: 6px 14px; border-radius: 50px;
            font-size: 0.8rem; font-weight: 600;
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(255,0,0,0.3);
        }
        .footer-yt:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,0,0,0.4); }

        /* ─── CARDS ─── */
        .card {
            background: var(--gradient-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: all 0.3s ease;
        }
        .card:hover { border-color: rgba(230,57,70,0.3); }

        /* ─── BUTTONS ─── */
        .btn-primary {
            background: var(--gradient-primary);
            color: white; border: none;
            padding: 12px 28px; border-radius: 50px;
            font-weight: 600; font-size: 0.95rem;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(230,57,70,0.4);
            text-decoration: none; display: inline-flex;
            align-items: center; gap: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230,57,70,0.5);
            color: white;
        }
        .btn-secondary {
            background: var(--bg-card2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 22px; border-radius: 50px;
            font-weight: 500; cursor: pointer;
            transition: all 0.3s; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        /* ─── SECTION TITLES ─── */
        .section-title {
            font-size: 1.75rem; font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .section-subtitle { color: var(--text-secondary); font-size: 0.95rem; }

        /* ─── BADGE ─── */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 50px;
            font-size: 0.75rem; font-weight: 600;
        }
        .badge-primary { background: rgba(230,57,70,0.2); color: var(--primary-light); border: 1px solid rgba(230,57,70,0.3); }
        .badge-gold { background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid rgba(255,215,0,0.3); }
        .badge-green { background: rgba(34,197,94,0.15); color: #4ADE80; border: 1px solid rgba(34,197,94,0.3); }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary-dark); border-radius: 3px; }

        /* ─── ANIMATIONS ─── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-ring {
            0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230,57,70,0.5); }
            70%  { transform: scale(1);    box-shadow: 0 0 0 15px rgba(230,57,70,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(230,57,70,0); }
        }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .fade-in { animation: fadeInUp 0.6s ease forwards; }
        .fade-in-delay-1 { animation: fadeInUp 0.6s ease 0.1s both; }
        .fade-in-delay-2 { animation: fadeInUp 0.6s ease 0.2s both; }
        .fade-in-delay-3 { animation: fadeInUp 0.6s ease 0.3s both; }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="brand-icon"><i class="fas fa-film"></i></div>
            <div>
                <div class="brand-name">CineBook</div>
                <div class="brand-tagline">Book Your Experience</div>
            </div>
        </a>
        <div class="navbar-right">
            {% if user %}
            <div class="nav-user">
                <div class="nav-user-avatar">{{ user.username[0].upper() }}</div>
                <span class="nav-user-name">{{ user.username }}</span>
            </div>
            <a href="/logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            {% endif %}
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-text">Developed by <span class="footer-brand">Learn With KASTRO</span></span>
            <span class="footer-text">•</span>
            <a href="https://www.youtube.com/@LearnWithKASTRO" target="_blank" class="footer-yt">
                <i class="fab fa-youtube"></i> Learn With KASTRO
            </a>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
