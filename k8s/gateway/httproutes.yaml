---
# ──────────────────────────────────────────────
# HTTPRoute - Frontend (catch-all)
# Routes all traffic by default to frontend
# ──────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: cinebook
spec:
  parentRefs:
    - name: cinebook-gateway
      namespace: cinebook
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 5000
          weight: 1
---
# ──────────────────────────────────────────────
# HTTPRoute - Auth Service
# Path: /auth/*
# ──────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-route
  namespace: cinebook
spec:
  parentRefs:
    - name: cinebook-gateway
      namespace: cinebook
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: auth-service
          port: 5001
          weight: 1
---
# ──────────────────────────────────────────────
# HTTPRoute - Movie Service
# Path: /movies/* and /movie/*
# ──────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: movie-route
  namespace: cinebook
spec:
  parentRefs:
    - name: cinebook-gateway
      namespace: cinebook
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /movies
      backendRefs:
        - name: movie-service
          port: 5002
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /movie
      backendRefs:
        - name: movie-service
          port: 5002
          weight: 1
---
# ──────────────────────────────────────────────
# HTTPRoute - Booking Service
# Path: /seats/* and /booking/*
# ──────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booking-route
  namespace: cinebook
spec:
  parentRefs:
    - name: cinebook-gateway
      namespace: cinebook
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /seats
      backendRefs:
        - name: booking-service
          port: 5003
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /booking
      backendRefs:
        - name: booking-service
          port: 5003
          weight: 1
---
# ──────────────────────────────────────────────
# HTTPRoute - Payment Service
# Path: /payment/* and /process_payment
# ──────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-route
  namespace: cinebook
spec:
  parentRefs:
    - name: cinebook-gateway
      namespace: cinebook
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /payment
      backendRefs:
        - name: payment-service
          port: 5004
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /process_payment
      backendRefs:
        - name: payment-service
          port: 5004
          weight: 1
